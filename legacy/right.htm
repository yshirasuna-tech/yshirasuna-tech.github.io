<dialog class="image-lightbox" id="image-lightbox">
  <button class="lightbox-close" type="button" aria-label="拡大画像を閉じる">×</button>
  <img loading="lazy" decoding="async" id="lightbox-image" src="" alt="">
  <p id="lightbox-caption"></p>
</dialog>
<script>
(function () {
  var lightbox = document.getElementById('image-lightbox');
  var lightboxImage = document.getElementById('lightbox-image');
  var lightboxCaption = document.getElementById('lightbox-caption');

  document.querySelectorAll('.lightbox-trigger').forEach(function (trigger) {
    trigger.addEventListener('click', function (event) {
      event.preventDefault();
      lightboxImage.src = trigger.getAttribute('data-full-image');
      lightboxImage.alt = trigger.getAttribute('data-caption');
      lightboxCaption.textContent = trigger.getAttribute('data-caption');
      lightbox.showModal();
    });
  });

  document.querySelector('.lightbox-close').addEventListener('click', function () {
    lightbox.close();
  });

  lightbox.addEventListener('click', function (event) {
    if (event.target === lightbox) lightbox.close();
  });
}());
</script>
